name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. دانلود کدهای پروژه
    - name: Checkout repository
      uses: actions/checkout@v4
      
    # 2. تنظیم نسخه جاوا (جاوا 17 برای نسخه‌های جدید اندروید استودیو استاندارد است)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 3. دادن اجازه اجرا به فایل gradlew (بسیار مهم در لینوکس/گیت‌هاب)
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    # 4. بیلد گرفتن پروژه (بهترین روش)
    - name: Build with Gradle
      run: ./gradlew :app:assembleDebug
      
    # 5. آپلود فایل APK ساخته شده تا بتوانید آن را دانلود کنید
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
